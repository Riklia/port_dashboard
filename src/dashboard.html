<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>127.0.0.1 - Port Dashboard</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 24px; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 1.4rem; margin: 0; color: #f8fafc; }
    .controls { display: flex; gap: 12px; align-items: center; font-size: 0.9rem; }
    input[type="search"] { background: #1e293b; border: 1px solid #334155; color: #f8fafc; padding: 6px 12px; border-radius: 6px; }
    button { background: #334155; color: #e2e8f0; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    button:hover { background: #475569; }
    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
    th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid #334155; font-size: 0.9rem; }
    th { background: #0f172a; color: #94a3b8; font-weight: 600; }
    td:first-child { white-space: nowrap; }
    tr:hover { background: #26334d; }
    a.port-link { color: #38bdf8; font-weight: 700; text-decoration: none; font-family: monospace; font-size: 1rem; }
    a.port-link:hover { text-decoration: underline; }
    .badge-http { background: #065f46; color: #6ee7b7; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; margin-left: 6px; white-space: nowrap; }
    .badge-self { background: #3730a3; color: #a5b4fc; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; margin-left: 6px; white-space: nowrap; }
    .cmd { color: #94a3b8; font-family: monospace; font-size: 0.8rem; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { color: #cbd5e1; }
    .sub { color: #64748b; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Listening Ports on 127.0.0.1</h1>
      <div class="controls">
        <input type="search" id="search" placeholder="Filter port, process, title..." oninput="applyFilters()">
        <label><input type="checkbox" id="showSystem" onchange="applyFilters()"> Show system / ephemeral ports</label>
        <button onclick="clearIgnored()">Reset Hidden (<span id="hiddenCount">0</span>)</button>
        <button id="refreshBtn" onclick="refreshDashboard(this)">&#x21bb; Refresh</button>
      </div>
    </header>
    <table>
      <thead>
        <tr>
          <th>Port</th>
          <th>What's There (HTTP / Title)</th>
          <th>Process</th>
          <th>PID</th>
          <th>Command / Path</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="portTable">
{{PORT_ROWS}}
      </tbody>
    </table>
  </div>
  <script>
    function getIgnored() {
      try { return JSON.parse(localStorage.getItem('ignoredPorts') || '[]'); } catch { return []; }
    }
    function hidePort(port) {
      const list = getIgnored();
      if (!list.includes(port)) list.push(port);
      localStorage.setItem('ignoredPorts', JSON.stringify(list));
      applyFilters();
    }
    function clearIgnored() {
      localStorage.removeItem('ignoredPorts');
      applyFilters();
    }
    function refreshDashboard(btn) {
      btn.disabled = true;
      btn.textContent = '\u21bb Scanning...';
      location.reload();
    }
    function applyFilters() {
      const q = document.getElementById('search').value.toLowerCase();
      const showSys = document.getElementById('showSystem').checked;
      const ignored = getIgnored();
      document.getElementById('hiddenCount').textContent = ignored.length;

      for (const tr of document.querySelectorAll('#portTable tr')) {
        const port = Number(tr.dataset.port);
        const isSys = tr.dataset.sys === '1';
        const text = tr.innerText.toLowerCase();
        const visible = !ignored.includes(port) && (showSys || !isSys) && (!q || text.includes(q));
        tr.style.display = visible ? '' : 'none';
      }
    }
    applyFilters();
  </script>
</body>
</html>
